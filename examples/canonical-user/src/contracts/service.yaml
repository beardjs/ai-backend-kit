openapi: 3.0.3
info:
  title: Canonical user example (illustrative)
  version: 0.0.0
security:
  - bearerAuth: []
paths:
  /users:
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/AuthMiddlewareBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict — RESOURCE_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    get:
      summary: Get user by id
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/AuthMiddlewareBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found — RESOURCE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token validated by the shared authorization middleware
        (`authorizeByGroup`). Group membership is enforced per route; record
        ownership is enforced in the domain service.
  responses:
    AuthMiddlewareBadRequest:
      description: Missing or malformed authorization header (auth middleware)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMiddlewareError'
    Unauthorized:
      description: Not authenticated — UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed — FORBIDDEN (group or ownership)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMiddlewareError'
    InternalError:
      description: Unexpected failure — DATABASE_ERROR or generic Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NewUser:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    UpdateUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    Error:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          description: Value of EErrorCode, translated by the i18n catalog.
          enum:
            - RESOURCE_NOT_FOUND
            - RESOURCE_CONFLICT
            - DATABASE_ERROR
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
        message:
          type: string
          description: Translated message — never an internal or driver message.
    AuthMiddlewareError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Message produced by the shared authorization middleware.
